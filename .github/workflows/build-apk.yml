name: Build APK

# 每次 push 到 main 分支时自动构建 APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 🛠 缓存 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 生成调试签名 (debug keystore)
        run: |
          keytool -genkey -v \
            -keystore app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug, OU=Nursing, O=XiaoNiu, L=SH, S=SH, C=CN"

      - name: 📦 构建 Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon

      - name: 📦 构建 Release APK (未签名)
        run: |
          ./gradlew assembleRelease --no-daemon || echo "Release build skipped (需要 release keystore)"

      - name: 📎 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nursing-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📎 上传 Release APK (如有)
        uses: actions/upload-artifact@v4
        with:
          name: nursing-assistant-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
        continue-on-error: true

      - name: 📊 显示 APK 信息
        run: |
          echo "=== Build Output ==="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK"
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK"
